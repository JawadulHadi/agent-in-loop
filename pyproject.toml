[project]
name = 'agent-in-loop'
version = '0.1.0'
description = 'A tool-calling agent loop in plain Python: no frameworks, step and token caps, human confirmation, JSONL logs.'
requires-python = '>=3.11'
dependencies = ['httpx>=0.27']

[project.optional-dependencies]
dev = ['pytest>=8', 'ruff>=0.6']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B']

[tool.pytest.ini_options]
pythonpath = ['.']

[tool.setuptools]
packages = ['agent_loop']
